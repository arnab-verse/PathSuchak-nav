    <!-- Early Theme Synchronization to prevent theme flash and ensure instant theme recognition -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('tactical_theme');
          var root = document.documentElement;
          if (t === 'light') {
            root.classList.remove('dark');
            root.classList.add('theme-light');
            root.setAttribute('data-theme', 'light');
          } else if (t === 'night-vision') {
            root.classList.remove('dark');
            root.classList.add('theme-night-vision');
            root.setAttribute('data-theme', 'night-vision');
          } else {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
